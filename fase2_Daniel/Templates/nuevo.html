<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Empleado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Registrar Empleado</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="POST" action="/empleados/nuevo">
        <label>Nombre:</label>
        <input type="text" name="nombre">
        <label>DUI:</label>
        <input type="text" name="dui">
        <label>Estado DUI:</label>
        <input type="text" name="estado_dui">
        <label>Estado Antecedentes:</label>
        <input type="text" name="estado_antecedentes">
        <label>Estado Carnet Junta:</label>
        <input type="text" name="estado_carnet_junta">
        <button type="submit">Guardar</button>
    </form>
    <br>
    <a href="/empleados">Regresar al listado</a>
</body>
</html>
